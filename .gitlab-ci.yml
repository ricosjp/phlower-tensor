variables:
  PHLOWER_VERSION: 1.2.0
  PHLOWER_IMAGE_REGISTRY: registry.ritc.jp/ricos/machine_learning/phlower

stages:
  - test
  - document_test
  - deploy

default:
  image: ${PHLOWER_IMAGE_REGISTRY}:${PHLOWER_VERSION}-py312-cpu

lint:
  stage: test
  script:
    - make install CUDA_TAG="cpu"
    - make lint
    - make mypy
  tags:
    - no-gpu
  dependencies: []

pytest_with_py312:
  stage: test
  script:
    - make install CUDA_TAG="cpu"
    - make test
    - uv run python3 -m coverage html -d coverage
    - uv run python3 -m coverage xml
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    expose_as: coverage
    paths:
      - coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  tags:
    - no-gpu
    - GenuineIntel
  dependencies: []


pytest_with_py311:
  stage: test
  image: ${PHLOWER_IMAGE_REGISTRY}:${PHLOWER_VERSION}-py311-cpu
  script:
    - make install CUDA_TAG="cpu"
    - make test
  dependencies: []

gpu_test:
  image: ${PHLOWER_IMAGE_REGISTRY}:${PHLOWER_VERSION}-py312-cu124
  stage: test
  script:
    - make install
    - uv run python3 -c "import torch; print(torch.cuda.get_arch_list())"
    - make gpu_test
  tags:
    - gpu
    - sm_75

