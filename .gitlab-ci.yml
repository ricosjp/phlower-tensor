.deploy:wheel:
  stage: deploy
  script:
    - uv version $VERSION
    - uv build
    - uv publish --username __token__ --password $PYPI_PUBLISH_TOKEN -n -v

deploy:wheel:tags:
  image: python:3.11-slim
  extends: .deploy:wheel
  before_script:
    - pip install uv
    - export VERSION=$CI_COMMIT_REF_NAME
  only:
    - tags

